<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Life — Финансы</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="manifest" href="../manifest.json">

  <style>
    .finance-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 35px 24px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 28px;
      color: #8272b8;
      text-decoration: none;
      font-weight: 600;
    }

    .finance-page h1 {
      margin-bottom: 8px;
    }

    .finance-subtitle {
      color: #85818e;
      margin-bottom: 30px;
    }

    .finance-overview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .finance-box,
    .finance-panel {
      background: white;
      border: 1px solid #eeeaf5;
      border-radius: 20px;
      padding: 24px;
    }

    .finance-box p {
      color: #85818e;
      margin-bottom: 12px;
    }

    .finance-box h2 {
      font-size: 25px;
    }

    .finance-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .finance-panel h2 {
      margin-bottom: 20px;
      font-size: 19px;
    }

    .finance-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .finance-form label {
      font-size: 14px;
      color: #77717f;
    }

    .finance-form input,
    .finance-form select {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #e6e1ef;
      border-radius: 10px;
      background: #fff;
      font: inherit;
    }

    .finance-form button {
      border: none;
      border-radius: 12px;
      padding: 14px;
      background: #9b8acb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .transaction-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .transaction-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #f0edf4;
    }

    .transaction-item small {
      display: block;
      color: #99939f;
      margin-top: 5px;
    }

    .income-amount {
      color: #4b9c79;
      font-weight: 600;
    }

    .expense-amount {
      color: #d27c88;
      font-weight: 600;
    }

    .delete-transaction {
      border: none;
      background: transparent;
      color: #aaa;
      cursor: pointer;
      margin-left: 8px;
    }

    .empty-transactions {
      color: #99939f;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .finance-overview,
      .finance-content {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="finance-page">

    <a class="back-link" href="../index.html">← Вернуться на главную</a>

    <h1>Мои финансы</h1>
    <p class="finance-subtitle">Контролируй доходы и расходы в одном месте.</p>

    <section class="finance-overview">

      <div class="finance-box">
        <p>Общий баланс</p>
        <h2 id="total-balance">0 ₸</h2>
      </div>

      <div class="finance-box">
        <p>Доходы</p>
        <h2 id="total-income">0 ₸</h2>
      </div>

      <div class="finance-box">
        <p>Расходы</p>
        <h2 id="total-expense">0 ₸</h2>
      </div>

    </section>

    <section class="finance-content">

      <div class="finance-panel">
        <h2>Добавить операцию</h2>

        <form class="finance-form" id="finance-form">

          <label>
            Тип операции
            <select id="operation-type" required>
              <option value="expense">Расход</option>
              <option value="income">Доход</option>
            </select>
          </label>

          <label>
            Название
            <input
              type="text"
              id="operation-name"
              placeholder="Например, продукты"
              required
            >
          </label>

          <label>
            Сумма (₸)
            <input
              type="number"
              id="operation-amount"
              placeholder="Например, 15000"
              min="1"
              step="1"
              required
            >
          </label>

          <label>
            Дата
            <input type="date" id="operation-date" required>
          </label>

          <button type="submit">Добавить операцию</button>

        </form>
      </div>

      <div class="finance-panel">
        <h2>История операций</h2>
        <div class="transaction-list" id="transaction-list">
          <p class="empty-transactions">Пока операций нет.</p>
        </div>
      </div>

    </section>
  </main>

  <script>
    const STORAGE_KEY = 'myLifeTransactions';

    const money = amount =>
      new Intl.NumberFormat('ru-RU').format(amount) + ' ₸';

    function getTransactions() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    }

    function saveTransactions(transactions) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
    }

    function renderFinance() {
      const transactions = getTransactions();

      const income = transactions
        .filter(item => item.type === 'income')
        .reduce((sum, item) => sum + item.amount, 0);

      const expense = transactions
        .filter(item => item.type === 'expense')
        .reduce((sum, item) => sum + item.amount, 0);

      document.getElementById('total-balance').textContent =
        money(income - expense);

      document.getElementById('total-income').textContent =
        money(income);

      document.getElementById('total-expense').textContent =
        money(expense);

      const list = document.getElementById('transaction-list');

      if (transactions.length === 0) {
        list.innerHTML =
          '<p class="empty-transactions">Пока операций нет.</p>';
        return;
      }

      list.innerHTML = '';

      transactions
        .sort((a, b) => b.id - a.id)
        .forEach(item => {
          const row = document.createElement('div');
          row.className = 'transaction-item';

          const info = document.createElement('div');
          const name = document.createElement('strong');
          const date = document.createElement('small');

          name.textContent = item.name;
          date.textContent = new Date(item.date + 'T12:00:00')
            .toLocaleDateString('ru-RU');

          info.append(name, date);

          const right = document.createElement('div');
          const amount = document.createElement('span');
          amount.className = item.type === 'income'
            ? 'income-amount'
            : 'expense-amount';

          amount.textContent =
            (item.type === 'income' ? '+' : '−') + money(item.amount);

          const deleteButton = document.createElement('button');
          deleteButton.className = 'delete-transaction';
          deleteButton.textContent = '✕';
          deleteButton.type = 'button';

          deleteButton.addEventListener('click', () => {
            const updated = getTransactions()
              .filter(transaction => transaction.id !== item.id);

            saveTransactions(updated);
            renderFinance();
          });

          right.append(amount, deleteButton);
          row.append(info, right);
          list.append(row);
        });
    }

    document.getElementById('operation-date').value =
      new Date().toLocaleDateString('en-CA');

    document.getElementById('finance-form')
      .addEventListener('submit', event => {
        event.preventDefault();

        const type = document.getElementById('operation-type').value;
        const name = document.getElementById('operation-name').value.trim();
        const amount = Number(
          document.getElementById('operation-amount').value
        );
        const date = document.getElementById('operation-date').value;

        if (!name || !amount || amount <= 0 || !date) return;

        const transactions = getTransactions();

        transactions.push({
          id: Date.now(),
          type,
          name,
          amount,
          date
        });

        saveTransactions(transactions);
        event.target.reset();

        document.getElementById('operation-date').value =
          new Date().toLocaleDateString('en-CA');

        renderFinance();
      });

    renderFinance();
  </script>
