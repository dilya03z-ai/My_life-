        <button id="add-note-button" type="button">+</button>
      </div>

  <div class="note-editor-header">
    <span id="note-editor-date"></span>
    <button type="button" id="close-note-editor">×</button>
  </div>

  <textarea id="note-content" placeholder="Напиши что-нибудь..."></textarea>

  <button type="button" id="save-note-button">
    Сохранить
  </button>

</div>
